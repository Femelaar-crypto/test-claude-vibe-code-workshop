<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DrugStore Assistant AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: oklch(98% 0.012 75);
    --surface: oklch(99.5% 0.004 75);
    --surface-2: oklch(96% 0.01 75);
    --border: oklch(89% 0.012 75);
    --text: oklch(24% 0.02 55);
    --muted: oklch(50% 0.02 55);
    --accent: oklch(44% 0.11 152);
    --accent-dark: oklch(36% 0.11 152);
    --accent-soft: oklch(94% 0.04 152);
    --on-accent: #fff;
    --ok: oklch(44% 0.11 152);
    --ok-soft: oklch(94% 0.04 152);
    --promo: oklch(46% 0.1 235);
    --promo-soft: oklch(94% 0.035 235);
    --warn: oklch(50% 0.12 70);
    --warn-soft: oklch(95% 0.05 80);
    --danger: oklch(48% 0.13 25);
    --danger-soft: oklch(94% 0.04 25);
    --shadow: 0 1px 2px oklch(0% 0 0 / 0.04), 0 4px 14px oklch(0% 0 0 / 0.06);
    --radius: 12px;
    --display: 'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
    --body: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: oklch(17% 0.01 60); --surface: oklch(22% 0.012 60); --surface-2: oklch(26% 0.012 60);
      --border: oklch(33% 0.012 60); --text: oklch(94% 0.01 75); --muted: oklch(70% 0.015 70);
      --accent: oklch(76% 0.13 152); --accent-dark: oklch(84% 0.12 152); --accent-soft: oklch(30% 0.06 152);
      --on-accent: oklch(15% 0.03 152);
      --ok: oklch(76% 0.13 152); --ok-soft: oklch(28% 0.06 152);
      --promo: oklch(76% 0.11 235); --promo-soft: oklch(30% 0.06 235);
      --warn: oklch(80% 0.13 75); --warn-soft: oklch(30% 0.06 75);
      --danger: oklch(76% 0.14 25); --danger-soft: oklch(30% 0.07 25);
      --shadow: 0 1px 2px oklch(0% 0 0 / 0.3), 0 4px 14px oklch(0% 0 0 / 0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: oklch(17% 0.01 60); --surface: oklch(22% 0.012 60); --surface-2: oklch(26% 0.012 60);
    --border: oklch(33% 0.012 60); --text: oklch(94% 0.01 75); --muted: oklch(70% 0.015 70);
    --accent: oklch(76% 0.13 152); --accent-dark: oklch(84% 0.12 152); --accent-soft: oklch(30% 0.06 152);
    --on-accent: oklch(15% 0.03 152);
    --ok: oklch(76% 0.13 152); --ok-soft: oklch(28% 0.06 152);
      --promo: oklch(76% 0.11 235); --promo-soft: oklch(30% 0.06 235);
    --warn: oklch(80% 0.13 75); --warn-soft: oklch(30% 0.06 75);
    --danger: oklch(76% 0.14 25); --danger-soft: oklch(30% 0.07 25);
    --shadow: 0 1px 2px oklch(0% 0 0 / 0.3), 0 4px 14px oklch(0% 0 0 / 0.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: var(--body); font-size: 14px; line-height: 1.5; }
  a { color: var(--accent); } a:hover { color: var(--accent-dark); }
  button { font-family: inherit; font-size: inherit; color: inherit; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  h1, h2, h3 { font-family: var(--display); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
  h1 { font-size: 26px; } h2 { font-size: 19px; } h3 { font-size: 15px; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .label { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .icon { width: 18px; height: 18px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .icon.sm { width: 14px; height: 14px; }

  .app { display: grid; grid-template-rows: 60px 1fr; height: 100vh; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; font-size: 17px; }
  .brand .icon { width: 24px; height: 24px; color: var(--accent); }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .mode-pill { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 500; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2); }
  .mode-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .mode-pill.live .dot { background: var(--ok); }
  .icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; }
  .icon-btn:hover { background: var(--surface-2); }

  .body { display: grid; grid-template-columns: 224px 1fr; min-height: 0; }
  .sidebar { border-right: 1px solid var(--border); padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; background: var(--surface); }
  .nav { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; border: none; background: transparent; text-align: left; cursor: pointer; color: var(--muted); font-weight: 500; min-height: 44px; }
  .nav:hover { background: var(--surface-2); }
  .nav.active { background: var(--accent-soft); color: var(--accent-dark); font-weight: 600; }
  .nav .badge { margin-left: auto; font-size: 11px; font-weight: 600; background: var(--accent); color: var(--on-accent); padding: 2px 7px; border-radius: 999px; }
  .sidebar .spacer { flex: 1; }
  .sidebar .demo-note { font-size: 11.5px; color: var(--muted); padding: 10px 12px; line-height: 1.45; border-top: 1px solid var(--border); }

  .main { overflow-y: auto; padding: 32px 40px 48px; }
  .view { max-width: 920px; }
  .view-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
  .view-head p { margin-top: 4px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 24px; }
  .card + .card, .grid + .card, .card + .grid { margin-top: 16px; }
  .card.lift { box-shadow: var(--shadow); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } .body { grid-template-columns: 64px 1fr; } .nav span.txt, .sidebar .demo-note, .sidebar .btn-primary span { display: none; } .main { padding: 20px; } }

  .textarea { width: 100%; min-height: 96px; padding: 14px 16px; border-radius: 10px; border: 1.5px solid var(--border); font: inherit; font-size: 15px; background: var(--surface); color: var(--text); resize: vertical; }
  .input { flex: 1; padding: 11px 14px; border-radius: 10px; border: 1.5px solid var(--border); font: inherit; background: var(--surface); color: var(--text); min-height: 44px; }
  .row { display: flex; gap: 10px; align-items: center; }
  .row.wrap { flex-wrap: wrap; }
  .btn-primary { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--accent); color: var(--on-accent); border: none; padding: 0 18px; min-height: 44px; border-radius: 10px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-primary:disabled { opacity: .45; cursor: not-allowed; }
  .btn-outline { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: transparent; color: var(--accent); border: 1.5px solid var(--accent); padding: 0 16px; min-height: 44px; border-radius: 10px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .btn-outline:hover { background: var(--accent-soft); }
  .btn-ghost { background: none; border: none; color: var(--muted); font-weight: 500; cursor: pointer; padding: 8px 4px; min-height: 44px; display: inline-flex; align-items: center; gap: 6px; }
  .btn-ghost:hover { color: var(--text); }
  .link { background: none; border: none; color: var(--accent); font-weight: 500; cursor: pointer; padding: 8px 0; min-height: 44px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; min-height: 40px; padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--border); background: var(--surface); cursor: pointer; font-weight: 500; }
  .chip:hover { border-color: var(--accent); }
  .chip.example { background: var(--surface-2); border-color: transparent; font-weight: 400; color: var(--text); text-align: left; }
  .chip.example:hover { border-color: var(--accent); }
  .chip-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .chip-grid .chip { border-radius: 10px; min-height: 48px; padding: 12px 16px; justify-content: flex-start; }

  .quote { font-family: var(--display); font-size: 18px; line-height: 1.35; }
  .found { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 5px 10px; border-radius: 8px; background: var(--surface-2); color: var(--muted); }
  .tag.on { background: var(--ok-soft); color: var(--ok); font-weight: 500; }
  .tag.ask { border: 1.5px dashed var(--border); background: transparent; }

  .banner { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 10px; font-size: 14px; line-height: 1.5; margin-bottom: 16px; }
  .banner .icon { margin-top: 2px; }
  .banner.doctor, .banner.urgent { background: var(--danger-soft); color: var(--danger); }
  .banner.pharmacist { background: var(--warn-soft); color: var(--warn); }
  .banner.info { background: var(--accent-soft); color: var(--accent-dark); }
  .banner strong { font-weight: 600; }

  .answer { font-size: 15px; line-height: 1.65; }
  .kv { display: flex; justify-content: space-between; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; }
  .kv:last-child { border-bottom: none; }
  .kv .k { color: var(--muted); }
  .kv .v { font-weight: 500; text-align: right; }
  .check { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; font-size: 13.5px; }
  .check .icon { width: 16px; height: 16px; margin-top: 2px; }
  .check.ok { color: var(--ok); } .check.bad { color: var(--danger); } .check.warn { color: var(--warn); }
  .check .t { color: var(--text); }

  .product { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .product .name { font-family: var(--display); font-weight: 600; font-size: 17px; }
  .product .price { font-family: var(--display); font-weight: 700; font-size: 20px; color: var(--accent); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .product .price s { color: var(--muted); font-weight: 500; font-size: 14px; margin-right: 6px; }
  .usage { margin-top: 10px; font-size: 13.5px; color: var(--muted); }
  .note { display: flex; gap: 10px; align-items: flex-start; padding: 11px 13px; border-radius: 10px; font-size: 13px; line-height: 1.5; margin-top: 12px; }
  .note .icon { width: 16px; height: 16px; margin-top: 2px; }
  .note.promo { background: var(--promo-soft); color: var(--promo); }
  .note.caution { background: var(--danger-soft); color: var(--danger); }
  .note.consult { background: var(--warn-soft); color: var(--warn); }
  .alt { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; }
  .alt:last-child { border-bottom: none; }
  .alt .why { color: var(--muted); }
  .src { display: inline-block; font-family: var(--mono); font-size: 12px; padding: 4px 9px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-2); color: var(--muted); margin: 0 6px 6px 0; }

  .spin { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid var(--border); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2s; } }

  .hist { display: flex; justify-content: space-between; align-items: center; gap: 16px; width: 100%; text-align: left; padding: 14px 4px; border: none; border-bottom: 1px solid var(--border); background: none; cursor: pointer; min-height: 56px; }
  .hist:last-child { border-bottom: none; }
  .hist:hover .q { color: var(--accent-dark); }
  .hist .q { font-weight: 500; }
  .hist .m { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .hist .c { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
  @media (max-width: 980px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .stat .n { font-family: var(--display); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stat .l { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .stat .d { display: block; margin-top: 2px; font-weight: 600; }
  .stat .d.up { color: var(--danger); } .stat .d.down { color: var(--ok); }

  /* filter bar */
  .fbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .fchip { display: inline-flex; align-items: center; gap: 6px; background: var(--accent-soft); color: var(--accent-dark); border: 1px solid transparent; border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; min-height: 34px; }
  .fchip:hover { border-color: var(--accent); }
  .fchip b { font-weight: 600; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface); }
  .segbtn { background: none; border: none; padding: 0 12px; min-height: 40px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .seg.small .segbtn { min-height: 30px; padding: 0 10px; font-size: 12px; }
  .segbtn + .segbtn { border-left: 1px solid var(--border); }
  .segbtn:hover { color: var(--text); }
  .segbtn.on { background: var(--accent-soft); color: var(--accent-dark); font-weight: 600; }

  /* dashboard grid */
  .dash { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; margin-bottom: 20px; }
  .dash .card { margin: 0; max-width: none; }
  .dash .span2 { grid-column: span 2; }
  @media (max-width: 980px) { .dash { grid-template-columns: 1fr; } .dash .span2 { grid-column: span 1; } }

  /* linked bar rows */
  .bar-row { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(60px, 1fr) 38px; gap: 10px; align-items: center; padding: 7px 6px; font-size: 13.5px; width: 100%; text-align: left; background: none; border: none; border-radius: 8px; cursor: pointer; color: inherit; }
  .bar-row.static { cursor: default; }
  .bar-row:not(.static):hover { background: var(--surface-2); }
  .bar-row.sel { background: var(--accent-soft); }
  .bar-row.sel .bar-label { color: var(--accent-dark); font-weight: 600; }
  .bar-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { height: 9px; background: var(--surface-2); border-radius: 5px; overflow: hidden; justify-self: stretch; }
  .bar-fill { display: block; height: 100%; background: var(--accent); border-radius: 5px; transition: width .18s ease; }
  .bar-n { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }

  /* cross-tab matrix */
  .matrix { display: flex; flex-direction: column; gap: 3px; overflow-x: auto; }
  .mx-row { display: grid; gap: 3px; align-items: stretch; min-width: 560px; }
  .mx-head { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .mx-col, .mx-tot { display: flex; align-items: center; justify-content: center; text-align: center; }
  .mx-head .mx-tot, .mx-corner { display: flex; align-items: center; justify-content: flex-end; }
  .mx-tot { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13px; justify-content: flex-end; padding-right: 2px; }
  .mx-rowlabel { text-align: left; background: none; border: none; padding: 0 6px 0 0; font-size: 13px; color: inherit; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-radius: 6px; min-height: 34px; }
  .mx-rowlabel:hover { color: var(--accent-dark); }
  .mx-rowlabel.sel { color: var(--accent-dark); font-weight: 700; }
  .mx-cell { border: none; border-radius: 6px; min-height: 34px; font-size: 13px; font-variant-numeric: tabular-nums; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .mx-cell:hover { outline: 2px solid var(--accent); outline-offset: -2px; }
  .mx-cell.sel { outline: 2.5px solid var(--accent-dark); outline-offset: -2px; }

  /* lift list */
  .lift { display: flex; gap: 12px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .lift:last-child { border-bottom: none; }
  .lift-x { font-family: var(--display); font-weight: 700; font-size: 17px; color: var(--accent); font-variant-numeric: tabular-nums; min-width: 44px; }
  .lift-t { display: flex; flex-direction: column; gap: 2px; font-size: 13.5px; }
  .lift-d { font-size: 12px; color: var(--muted); }

  /* tooltip */
  #tip { position: fixed; z-index: 90; pointer-events: none; max-width: 260px; background: var(--text); color: var(--bg); font-size: 12.5px; line-height: 1.4; padding: 7px 10px; border-radius: 8px; box-shadow: var(--shadow); opacity: 0; transition: opacity .12s; }
  #tip.on { opacity: 1; }

  .customer-card { max-width: 560px; }
  .customer-card .answer { font-size: 17px; }

  /* Settings popover */
  .pop { position: absolute; top: 56px; right: 24px; width: 380px; z-index: 20; }
  .pop .card { box-shadow: var(--shadow); }
  .radio { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; cursor: pointer; }
  .radio input { margin-top: 4px; }
  .radio .d { font-size: 12.5px; color: var(--muted); }

  /* Presentation mode */
  #present { position: fixed; inset: 0; background: var(--bg); z-index: 50; display: none; padding: 6vh 8vw; overflow: auto; }
  #present.on { display: block; }
  #present .close { position: absolute; top: 20px; right: 24px; }
  #present .pname { font-family: var(--display); font-size: clamp(28px, 4vw, 44px); font-weight: 700; line-height: 1.15; }
  #present .pprice { font-family: var(--display); font-size: clamp(26px, 3.6vw, 40px); font-weight: 700; color: var(--accent); margin-top: 8px; }
  #present .pprice s { color: var(--muted); font-size: .6em; font-weight: 500; margin-right: 10px; }
  #present .ptext { font-size: clamp(20px, 2.4vw, 27px); line-height: 1.5; margin-top: 28px; max-width: 30ch; }
  #present .note { font-size: clamp(16px, 1.8vw, 20px); padding: 16px 20px; margin-top: 24px; max-width: 40ch; }
  #present .note .icon { width: 22px; height: 22px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-cross" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></symbol>

    <symbol id="i-clip" viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="16" rx="2"/><path d="M9 4V3a1 1 0 011-1h4a1 1 0 011 1v1"/><path d="M9 10h6M9 14h6"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-3.5 3.1-6 7-6s7 2.5 7 6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2.5-6.5L4 12z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M4 12l5 5 11-11"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3l10 18H2L12 3z"/><path d="M12 10v4"/><path d="M12 16.6v.1"/></symbol>

    const prof = PROFILES[(() => { let x = rnd() * PROFILES.reduce((s, p) => s + p.w, 0); for (let i = 0; i < PROFILES.length; i++) { x -= PROFILES[i].w; if (x <= 0) return i; } return 0; })()];
    triage.age_band = prof.band;
    const gap = rnd() < 0.05;
    const tag = gap ? weighted(GAP_TERMS, rnd) : weighted(prof.complaints, rnd);
    triage.complaints = [tag];
    triage.duration = weighted(LONG_RUNNING.has(tag) ? { 'al langere tijd': 45, 'een week of langer': 30, 'een paar dagen': 20, vandaag: 5 }
      : SHORT_RUNNING.has(tag) ? { vandaag: 50, 'een paar dagen': 35, 'een week of langer': 12, 'al langere tijd': 3 }
        : { vandaag: 22, 'een paar dagen': 42, 'een week of langer': 24, 'al langere tijd': 12 }, rnd);
    triage.prior_remedies = weighted(LONG_RUNNING.has(tag) ? { 'iets zonder recept': 45, 'iets op recept': 20, 'nog niets': 27, 'weet niet': 8 }
      : { 'nog niets': 52, 'iets zonder recept': 32, 'iets op recept': 9, 'weet niet': 7 }, rnd);
    if (triage.prior_remedies === 'iets zonder recept') triage.prior_failed = rnd() < 0.4;
    if (prof.band === '18-34') triage.pregnant = rnd() < (['hoofdpijn', 'vermoeidheid', 'verkoudheid'].includes(tag) ? 0.18 : 0.06);
    else if (prof.band === '35-49') triage.pregnant = rnd() < 0.04;

  base.triage = triage;
  const r = resolve(base);
  r.at = at;

}
function buildHistoryRows() {
  const rnd = mulberry32(20260907), rows = [];
  for (let day = 60; day >= 1; day--) {
    const d = new Date(TODAY); d.setDate(d.getDate() - day);
    const dow = d.getDay();
    if (dow === 0) continue; // closed on Sundays
    const n = Math.round((dow === 6 ? 30 : 18) + rnd() * 13); // a staffed counter, not a trickle
    for (let i = 0; i < n; i++) {
      const h = 9 + Math.floor(rnd() * 9), m = Math.floor(rnd() * 60);
      const at = new Date(d); at.setHours(h, m, 0, 0);
      rows.push(synthRow(rnd, at.toISOString()));
    }

}
let HISTORY_ROWS = [];

/* ---------- dashboard: linked filters over the log rows ---------- */
const DIMS = {
  complaint: { label: 'Klacht', values: r => r.complaints },
  age_band: { label: 'Leeftijd', values: r => r.age_band ? [r.age_band] : [] },
  category: { label: 'Categorie', values: r => [r.category] },
  outcome: { label: 'Uitkomst', values: r => [OUTCOME_LABEL[r.outcome] || r.outcome] },
  escalation: { label: 'Doorverwijzing', values: r => [ESC_LABEL[r.escalation] || r.escalation] },
  duration: { label: 'Sinds wanneer', values: r => [cap(r.duration)] },
};
function allRows() {
  const session = state.history.map(r => rowOf(r, true));
  return HISTORY_ROWS.concat(session).sort((a, b) => (a.at < b.at ? 1 : -1));
}
function inPeriod(rows) {
  if (state.period === 0) return rows;
  const cut = new Date(TODAY); cut.setDate(cut.getDate() - state.period); cut.setHours(0, 0, 0, 0);
  return rows.filter(r => new Date(r.at) >= cut);
}
function matches(row, skipDim) {
  for (const [dim, val] of Object.entries(state.filters)) {
    if (val == null || dim === skipDim) continue;
    if (dim === 'pregnant') { if (!row.pregnant) return false; continue; }
    if (!DIMS[dim].values(row).includes(val)) return false;
  }

}
function tally(rows, dim) {
  const m = new Map();
  for (const r of rows) for (const v of DIMS[dim].values(r)) { if (!v) continue; m.set(v, (m.get(v) || 0) + 1); }

}
function pctLabel(n, d) { return d ? Math.round(n / d * 100) + '%' : '0%'; }

function panelHtml(dim, baseRows, opts = {}) {
  const scope = baseRows.filter(r => matches(r, dim));
  const cur = tally(scope, dim), all = tally(baseRows, dim);
  const sel = state.filters[dim];
  // Share mode answers "what fraction of THIS group matches the selection", which is
  // the only fair comparison when the groups differ in size.
  if (opts.share) {
    const rated = [...all.entries()].map(([k, total]) => [k, (cur.get(k) || 0) / total, cur.get(k) || 0, total])
      .sort((a, b) => b[1] - a[1]).slice(0, opts.limit || 8);
    if (!rated.length) return '<p class="muted small">Geen gegevens in deze periode</p>';
    const maxRate = Math.max(...rated.map(r => r[1])) || 1;
    return rated.map(([k, rate, n, total]) => `<button class="bar-row${sel === k ? ' sel' : ''}" data-filter="${dim}" data-value="${esc(k)}" aria-pressed="${sel === k}" data-tip="${esc(k)} — ${n} van de ${total} vragen uit deze leeftijdsgroep (${pctLabel(n, total)})">
      <span class="bar-label">${esc(cap(String(k)))}</span>
      <span class="bar-track" style="width:${Math.max(6, rate / maxRate * 100)}%"><span class="bar-fill" style="width:100%"></span></span>
      <span class="bar-n">${pctLabel(n, total)}</span></button>`).join('');
  }
  const entries = [...all.entries()].sort((a, b) => (cur.get(b[0]) || 0) - (cur.get(a[0]) || 0) || b[1] - a[1]).slice(0, opts.limit || 8);
  if (!entries.length) return '<p class="muted small">Geen gegevens in deze periode</p>';
  const max = Math.max(...entries.map(e => e[1]));

    const n = cur.get(k) || 0;
    const isSel = sel === k;
    return `<button class="bar-row${isSel ? ' sel' : ''}" data-filter="${dim}" data-value="${esc(k)}" aria-pressed="${isSel}" data-tip="${esc(k)} — ${n} van ${total} vragen in deze periode (${pctLabel(n, total)})">
      <span class="bar-label">${esc(cap(String(k)))}</span>
      <span class="bar-track" style="width:${Math.max(6, total / max * 100)}%"><span class="bar-fill" style="width:${total ? n / total * 100 : 0}%"></span></span>
      <span class="bar-n">${n}</span></button>`;
  }).join('');
}

function matrixHtml(baseRows) {
  const scope = baseRows.filter(r => matches(r, 'complaint') && matches(r, 'age_band'));
  const comps = [...tally(scope, 'complaint').entries()].sort((a, b) => b[1] - a[1]).slice(0, 8).map(e => e[0]);
  // only audiences that actually carry a complaint: non-symptom rows have none
  const withComplaint = scope.filter(r => r.complaints.length);
  const AUD_ORDER = AGE_BANDS.map(b => BAND_LABEL[b]);
  const present = tally(withComplaint, 'age_band');
  const auds = AUD_ORDER.filter(a => present.get(a)).concat([...present.keys()].filter(a => !AUD_ORDER.includes(a)));
  if (!comps.length || !auds.length) return '<p class="muted small">Geen gegevens in deze periode</p>';
  const cell = {}; let max = 0;
  for (const r of scope) for (const c of r.complaints) { if (!comps.includes(c)) continue; const k = c + '||' + r.age_band; cell[k] = (cell[k] || 0) + 1; if (cell[k] > max) max = cell[k]; }
  const short = a => a.replace(' jaar en ouder', '+').replace(' jaar', '');
  const grid = ` style="grid-template-columns:136px repeat(${auds.length}, minmax(42px, 1fr)) 54px"`;
  const head = `<div class="mx-row mx-head"${grid}><span class="mx-corner"></span>${auds.map(a => `<span class="mx-col" data-tip="${esc(a)}">${esc(short(a))}</span>`).join('')}<span class="mx-tot">Totaal</span></div>`;
  const body = comps.map(c => {
    const rowTot = scope.filter(r => r.complaints.includes(c)).length;
    const cells = auds.map(a => {
      const n = cell[c + '||' + a] || 0;
      const pct = max ? n / max : 0;
      const strong = pct > 0.55;
      const on = state.filters.complaint === c && state.filters.age_band === a;
      return `<button class="mx-cell${on ? ' sel' : ''}" data-cell="${esc(c)}||${esc(a)}" style="background:color-mix(in oklab, var(--accent) ${Math.round(pct * 82)}%, var(--surface-2)); color:${strong ? 'var(--on-accent)' : 'var(--text)'}" data-tip="${esc(cap(c))} bij ${esc(a)} — ${n} ${n === 1 ? 'vraag' : 'vragen'}, ${pctLabel(n, rowTot)} van alle ${esc(c)}-vragen">${n || ''}</button>`;
    }).join('');
    return `<div class="mx-row"${grid}><button class="mx-rowlabel${state.filters.complaint === c ? ' sel' : ''}" data-filter="complaint" data-value="${esc(c)}" data-tip="Filter op ${esc(c)}">${esc(cap(c))}</button>${cells}<span class="mx-tot">${rowTot}</span></div>`;
  }).join('');
  return `<div class="matrix">${head}${body}</div>`;
}

// Which attributes are over-represented in the current selection, versus the period as a whole.
function liftHtml(baseRows, filtered) {
  if (!hasFilters()) return `<p class="muted small">Klik op een klacht, leeftijdsgroep of uitkomst hiernaast. Alle panelen en de kruistabel filteren mee, en hier verschijnt wat aan die groep opvalt.</p>`;
  if (filtered.length < 8) return `<p class="muted small">Te weinig vragen in deze selectie (${filtered.length}) voor een betrouwbaar profiel. Verruim de periode of het filter.</p>`;
  const out = [];
  for (const dim of ['age_band', 'duration', 'outcome', 'escalation', 'category', 'complaint']) {
    if (state.filters[dim] != null) continue;
    const sub = tally(filtered, dim), base = tally(baseRows, dim);
    for (const [k, n] of sub.entries()) {
      if (n < 3) continue;
      if (dim === 'escalation' && k === ESC_LABEL.none) continue;
      const share = n / filtered.length, baseShare = (base.get(k) || 0) / baseRows.length;
      if (baseShare <= 0) continue;
      const lift = share / baseShare;
      if (lift >= 1.4) out.push({ dim, k, n, share, lift });
    }
  }
  const preg = filtered.filter(r => r.pregnant).length;
  if (preg >= 3) {
    const bs = baseRows.filter(r => r.pregnant).length / baseRows.length;
    if (bs > 0 && (preg / filtered.length) / bs >= 1.4) out.push({ dim: 'pregnant', k: 'Zwanger of borstvoeding', n: preg, share: preg / filtered.length, lift: (preg / filtered.length) / bs });
  }
  out.sort((a, b) => b.lift - a.lift);
  if (!out.length) return `<p class="muted small">Deze selectie wijkt niet noemenswaardig af van het gemiddelde in deze periode.</p>`;
  return out.slice(0, 5).map(o => `<div class="lift"><span class="lift-x">${o.lift.toFixed(1)}×</span><span class="lift-t"><strong>${esc(o.k)}</strong><span class="lift-d">${DIMS[o.dim] ? DIMS[o.dim].label : 'Kenmerk'} · ${o.n} vragen · ${Math.round(o.share * 100)}% van deze selectie</span></span></div>`).join('');
}

function buildCsv(rows) {

function kpi(filtered, baseRows) {

    if (!hasFilters() || !filtered.length || !baseRows.length) return '';
    const d = Math.round(n / filtered.length * 100) - Math.round(total / baseRows.length * 100);
    if (Math.abs(d) < 3) return '<span class="d">gelijk aan gemiddeld</span>';

  };

    <div class="stat"><div class="n">${f(c(filtered, ref))}</div><div class="l">Doorverwezen ${delta(c(filtered, ref), c(baseRows, ref))}</div></div>
    <div class="stat"><div class="n">${f(c(filtered, gap))}</div><div class="l">Niet in assortiment ${delta(c(filtered, gap), c(baseRows, gap))}</div></div>
    <div class="stat"><div class="n">${f(c(filtered, promo))}</div><div class="l">Met actie ${delta(c(filtered, promo), c(baseRows, promo))}</div></div>

}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-view],[data-action],[data-example],[data-gap],[data-hist],[data-filter],[data-cell],[data-period],[data-agemode]');
  if (!b) { if (!e.target.closest('#pop') && !e.target.closest('#settingsBtn')) { const pop = document.getElementById('pop'); if (!pop.hidden) { pop.hidden = true; } } return; }
  if (b.dataset.view) { state.view = b.dataset.view; render(); return; }
  if (b.dataset.example) { state.view = 'ask'; state.phase = 'input'; state.question = b.dataset.example; render(); startQuestion(b.dataset.example); return; }
  if (b.dataset.hist !== undefined) { state.result = state.history[+b.dataset.hist]; state.view = 'employee'; render(); return; }
  if (b.dataset.filter) { const d = b.dataset.filter, v = b.dataset.value; state.filters[d] = state.filters[d] === v ? null : v; hideTip(); render(); return; }
  if (b.dataset.cell) { const [c, a] = b.dataset.cell.split('||'); const on = state.filters.complaint === c && state.filters.age_band === a; state.filters.complaint = on ? null : c; state.filters.age_band = on ? null : a; hideTip(); render(); return; }
  if (b.dataset.period) { state.period = +b.dataset.period; render(); return; }
  if (b.dataset.agemode) { state.ageMode = b.dataset.agemode; render(); return; }
  if (b.dataset.gap && b.dataset.value !== undefined) { answerGap(b.dataset.gap, b.dataset.value); return; }
  const a = b.dataset.action;
  if (a === 'send') { const q = document.getElementById('q').value.trim(); if (q) startQuestion(q); }
  if (a === 'free') { const v = document.getElementById('free').value.trim(); if (v) answerGap(b.dataset.gap, v); }
  if (a === 'new') reset();
  if (a === 'present') openPresent();
  if (a === 'csv') exportCsv();
  if (a === 'clearf') { for (const k of Object.keys(state.filters)) state.filters[k] = null; render(); }
  if (a === 'closePresent') document.getElementById('present').classList.remove('on');
  if (a === 'closeSettings') document.getElementById('pop').hidden = true;
});
/* tooltip layer for the dashboard marks */
const tipEl = document.getElementById('tip');
function hideTip() { tipEl.classList.remove('on'); }
document.addEventListener('mousemove', e => {
  const t = e.target.closest('[data-tip]');
  if (!t) { hideTip(); return; }
  tipEl.textContent = t.dataset.tip;
  tipEl.classList.add('on');
  const r = tipEl.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY + 16;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14;
  tipEl.style.left = Math.max(8, x) + 'px'; tipEl.style.top = Math.max(8, y) + 'px';
});
document.addEventListener('scroll', hideTip, true);

document.getElementById('settingsBtn').addEventListener('click', () => { const pop = document.getElementById('pop'); pop.hidden = !pop.hidden; renderSettings(); });
document.addEventListener('change', e => {
  if (e.target.name === 'mode') { state.mode = e.target.value; renderSidebar(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'key') state.apiKey = e.target.value.trim();
  if (e.target.id === 'q') state.question = e.target.value;
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { document.getElementById('present').classList.remove('on'); document.getElementById('pop').hidden = true; }
  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'q') { e.preventDefault(); const q = e.target.value.trim(); if (q) startQuestion(q); }
  if (e.key === 'Enter' && e.target.id === 'free') { e.preventDefault(); const v = e.target.value.trim(); if (v) answerGap(state.gaps[0], v); }
});

/* ---------- seed: ten realistic earlier questions so the tool opens in a working state ---------- */
function seed(question, fill, dayOffset, hhmm) {
  const ctx = analyze(question); Object.assign(ctx.triage, fill || {}); ctx.triage.complete = true;
  const r = resolve(ctx); Object.assign(r, composeSim(r)); r.mode = 'sim';
  const d = new Date(TODAY); d.setDate(d.getDate() - dayOffset); const [h, m] = hhmm.split(':'); d.setHours(+h, +m, 0, 0);
  r.at = d.toISOString();
  r.timestamp = (dayOffset === 0 ? 'Vandaag' : dayOffset === 1 ? 'Gisteren' : fmtDate(d.toISOString().slice(0, 10))) + ' ' + hhmm;
  state.history.unshift(r);
}
seed('Mijn moeder van 72 heeft al langere tijd last van gewrichtspijn, ze gebruikt medicijnen van de huisarts', {}, 1, '09:02');
seed('Hebben jullie vitamine D?', {}, 1, '10:15');
seed('Mijn zoon van 15 heeft puistjes, sinds een paar maanden, hij heeft nog niets geprobeerd', {}, 1, '11:40');
seed('Is er korting op aftersun?', {}, 1, '13:05');
seed('Mijn peuter heeft koorts sinds vannacht, nog niets gegeven', {}, 1, '15:30');
seed('Heb je iets tegen wratten?', {}, 1, '16:48');
seed('Kan ik een geopende dagcrème retourneren?', {}, 0, '08:41');
seed('Ik ben 29 en zwanger, sinds vanochtend hoofdpijn, nog niets genomen', {}, 0, '09:12');
seed('Mijn zoon van 8 heeft sinds gisteren keelpijn, we hebben nog niets geprobeerd', {}, 0, '09:35');
seed('Mijn man van 45 wil stoppen met roken, hij heeft eerder pleisters geprobeerd', { duration: 'een week of langer' }, 0, '10:20');
state.result = state.history[0];
HISTORY_ROWS = buildHistoryRows();
render();
