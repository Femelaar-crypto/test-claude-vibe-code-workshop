<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DrugStore Assistant AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: oklch(98% 0.012 75);
    --surface: oklch(99.5% 0.004 75);
    --surface-2: oklch(96% 0.01 75);
    --border: oklch(89% 0.012 75);
    --text: oklch(24% 0.02 55);
    --muted: oklch(50% 0.02 55);
    --accent: oklch(44% 0.11 152);
    --accent-dark: oklch(36% 0.11 152);
    --accent-soft: oklch(94% 0.04 152);
    --on-accent: #fff;
    --ok: oklch(44% 0.11 152);
    --ok-soft: oklch(94% 0.04 152);
    --promo: oklch(46% 0.1 235);
    --promo-soft: oklch(94% 0.035 235);
    --warn: oklch(50% 0.12 70);
    --warn-soft: oklch(95% 0.05 80);
    --danger: oklch(48% 0.13 25);
    --danger-soft: oklch(94% 0.04 25);
    --shadow: 0 1px 2px oklch(0% 0 0 / 0.04), 0 4px 14px oklch(0% 0 0 / 0.06);
    --radius: 12px;
    --display: 'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
    --body: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: oklch(17% 0.01 60); --surface: oklch(22% 0.012 60); --surface-2: oklch(26% 0.012 60);
      --border: oklch(33% 0.012 60); --text: oklch(94% 0.01 75); --muted: oklch(70% 0.015 70);
      --accent: oklch(76% 0.13 152); --accent-dark: oklch(84% 0.12 152); --accent-soft: oklch(30% 0.06 152);
      --on-accent: oklch(15% 0.03 152);
      --ok: oklch(76% 0.13 152); --ok-soft: oklch(28% 0.06 152);
      --promo: oklch(76% 0.11 235); --promo-soft: oklch(30% 0.06 235);
      --warn: oklch(80% 0.13 75); --warn-soft: oklch(30% 0.06 75);
      --danger: oklch(76% 0.14 25); --danger-soft: oklch(30% 0.07 25);
      --shadow: 0 1px 2px oklch(0% 0 0 / 0.3), 0 4px 14px oklch(0% 0 0 / 0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: oklch(17% 0.01 60); --surface: oklch(22% 0.012 60); --surface-2: oklch(26% 0.012 60);
    --border: oklch(33% 0.012 60); --text: oklch(94% 0.01 75); --muted: oklch(70% 0.015 70);
    --accent: oklch(76% 0.13 152); --accent-dark: oklch(84% 0.12 152); --accent-soft: oklch(30% 0.06 152);
    --on-accent: oklch(15% 0.03 152);
    --ok: oklch(76% 0.13 152); --ok-soft: oklch(28% 0.06 152);
      --promo: oklch(76% 0.11 235); --promo-soft: oklch(30% 0.06 235);
    --warn: oklch(80% 0.13 75); --warn-soft: oklch(30% 0.06 75);
    --danger: oklch(76% 0.14 25); --danger-soft: oklch(30% 0.07 25);
    --shadow: 0 1px 2px oklch(0% 0 0 / 0.3), 0 4px 14px oklch(0% 0 0 / 0.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: var(--body); font-size: 14px; line-height: 1.5; }
  a { color: var(--accent); } a:hover { color: var(--accent-dark); }
  button { font-family: inherit; font-size: inherit; color: inherit; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  h1, h2, h3 { font-family: var(--display); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
  h1 { font-size: 26px; } h2 { font-size: 19px; } h3 { font-size: 15px; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .label { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .icon { width: 18px; height: 18px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .icon.sm { width: 14px; height: 14px; }

  .app { display: grid; grid-template-rows: 60px 1fr; height: 100vh; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; font-size: 17px; }
  .brand .icon { width: 24px; height: 24px; color: var(--accent); }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .mode-pill { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 500; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2); }
  .mode-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .mode-pill.live .dot { background: var(--ok); }
  .icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; }
  .icon-btn:hover { background: var(--surface-2); }

  .body { display: grid; grid-template-columns: 224px 1fr; min-height: 0; }
  .sidebar { border-right: 1px solid var(--border); padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; background: var(--surface); }
  .nav { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; border: none; background: transparent; text-align: left; cursor: pointer; color: var(--muted); font-weight: 500; min-height: 44px; }
  .nav:hover { background: var(--surface-2); }
  .nav.active { background: var(--accent-soft); color: var(--accent-dark); font-weight: 600; }
  .nav .badge { margin-left: auto; font-size: 11px; font-weight: 600; background: var(--accent); color: var(--on-accent); padding: 2px 7px; border-radius: 999px; }
  .sidebar .spacer { flex: 1; }
  .sidebar .demo-note { font-size: 11.5px; color: var(--muted); padding: 10px 12px; line-height: 1.45; border-top: 1px solid var(--border); }

  .main { overflow-y: auto; padding: 32px 40px 48px; }
  .view { max-width: 920px; }
  .view-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
  .view-head p { margin-top: 4px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 24px; }
  .card + .card, .grid + .card, .card + .grid { margin-top: 16px; }
  .card.lift { box-shadow: var(--shadow); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } .body { grid-template-columns: 64px 1fr; } .nav span.txt, .sidebar .demo-note, .sidebar .btn-primary span { display: none; } .main { padding: 20px; } }

  .textarea { width: 100%; min-height: 96px; padding: 14px 16px; border-radius: 10px; border: 1.5px solid var(--border); font: inherit; font-size: 15px; background: var(--surface); color: var(--text); resize: vertical; }
  .input { flex: 1; padding: 11px 14px; border-radius: 10px; border: 1.5px solid var(--border); font: inherit; background: var(--surface); color: var(--text); min-height: 44px; }
  .row { display: flex; gap: 10px; align-items: center; }
  .row.wrap { flex-wrap: wrap; }
  .btn-primary { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--accent); color: var(--on-accent); border: none; padding: 0 18px; min-height: 44px; border-radius: 10px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-primary:disabled { opacity: .45; cursor: not-allowed; }
  .btn-outline { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: transparent; color: var(--accent); border: 1.5px solid var(--accent); padding: 0 16px; min-height: 44px; border-radius: 10px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .btn-outline:hover { background: var(--accent-soft); }
  .btn-ghost { background: none; border: none; color: var(--muted); font-weight: 500; cursor: pointer; padding: 8px 4px; min-height: 44px; display: inline-flex; align-items: center; gap: 6px; }
  .btn-ghost:hover { color: var(--text); }
  .link { background: none; border: none; color: var(--accent); font-weight: 500; cursor: pointer; padding: 8px 0; min-height: 44px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; min-height: 40px; padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--border); background: var(--surface); cursor: pointer; font-weight: 500; }
  .chip:hover { border-color: var(--accent); }
  .chip.example { background: var(--surface-2); border-color: transparent; font-weight: 400; color: var(--text); text-align: left; }
  .chip.example:hover { border-color: var(--accent); }
  .chip-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .chip-grid .chip { border-radius: 10px; min-height: 48px; padding: 12px 16px; justify-content: flex-start; }

  .quote { font-family: var(--display); font-size: 18px; line-height: 1.35; }
  .found { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 5px 10px; border-radius: 8px; background: var(--surface-2); color: var(--muted); }
  .tag.on { background: var(--ok-soft); color: var(--ok); font-weight: 500; }
  .tag.ask { border: 1.5px dashed var(--border); background: transparent; }

  .banner { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 10px; font-size: 14px; line-height: 1.5; margin-bottom: 16px; }
  .banner .icon { margin-top: 2px; }
  .banner.doctor, .banner.urgent { background: var(--danger-soft); color: var(--danger); }
  .banner.pharmacist { background: var(--warn-soft); color: var(--warn); }
  .banner.info { background: var(--accent-soft); color: var(--accent-dark); }
  .banner strong { font-weight: 600; }

  .answer { font-size: 15px; line-height: 1.65; }
  .kv { display: flex; justify-content: space-between; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; }
  .kv:last-child { border-bottom: none; }
  .kv .k { color: var(--muted); }
  .kv .v { font-weight: 500; text-align: right; }
  .check { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; font-size: 13.5px; }
  .check .icon { width: 16px; height: 16px; margin-top: 2px; }
  .check.ok { color: var(--ok); } .check.bad { color: var(--danger); } .check.warn { color: var(--warn); }
  .check .t { color: var(--text); }

  .product { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .product .name { font-family: var(--display); font-weight: 600; font-size: 17px; }
  .product .price { font-family: var(--display); font-weight: 700; font-size: 20px; color: var(--accent); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .product .price s { color: var(--muted); font-weight: 500; font-size: 14px; margin-right: 6px; }
  .usage { margin-top: 10px; font-size: 13.5px; color: var(--muted); }
  .note { display: flex; gap: 10px; align-items: flex-start; padding: 11px 13px; border-radius: 10px; font-size: 13px; line-height: 1.5; margin-top: 12px; }
  .note .icon { width: 16px; height: 16px; margin-top: 2px; }
  .note.promo { background: var(--promo-soft); color: var(--promo); }
  .note.caution { background: var(--danger-soft); color: var(--danger); }
  .note.consult { background: var(--warn-soft); color: var(--warn); }
  .alt { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; }
  .alt:last-child { border-bottom: none; }
  .alt .why { color: var(--muted); }
  .src { display: inline-block; font-family: var(--mono); font-size: 12px; padding: 4px 9px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-2); color: var(--muted); margin: 0 6px 6px 0; }

  .spin { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid var(--border); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2s; } }

  .hist { display: flex; justify-content: space-between; align-items: center; gap: 16px; width: 100%; text-align: left; padding: 14px 4px; border: none; border-bottom: 1px solid var(--border); background: none; cursor: pointer; min-height: 56px; }
  .hist:last-child { border-bottom: none; }
  .hist:hover .q { color: var(--accent-dark); }
  .hist .q { font-weight: 500; }
  .hist .m { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .hist .c { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
  @media (max-width: 860px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .stat .n { font-family: var(--display); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stat .l { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 14px; overflow-x: auto; }
  .tab { background: none; border: none; padding: 10px 14px; min-height: 44px; color: var(--muted); font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent-dark); border-bottom-color: var(--accent); font-weight: 600; }
  .bar-row { display: grid; grid-template-columns: minmax(140px, 1fr) 2fr 44px; gap: 12px; align-items: center; padding: 6px 0; font-size: 13.5px; }
  .bar-label { min-width: 0; }
  .bar-sub { display: block; font-size: 12px; color: var(--muted); }
  .bar-track { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
  .bar-fill { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
  .bar-n { text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; }

  .customer-card { max-width: 560px; }
  .customer-card .answer { font-size: 17px; }

  /* Settings popover */
  .pop { position: absolute; top: 56px; right: 24px; width: 380px; z-index: 20; }
  .pop .card { box-shadow: var(--shadow); }
  .radio { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; cursor: pointer; }
  .radio input { margin-top: 4px; }
  .radio .d { font-size: 12.5px; color: var(--muted); }

  /* Presentation mode */
  #present { position: fixed; inset: 0; background: var(--bg); z-index: 50; display: none; padding: 6vh 8vw; overflow: auto; }
  #present.on { display: block; }
  #present .close { position: absolute; top: 20px; right: 24px; }
  #present .pname { font-family: var(--display); font-size: clamp(28px, 4vw, 44px); font-weight: 700; line-height: 1.15; }
  #present .pprice { font-family: var(--display); font-size: clamp(26px, 3.6vw, 40px); font-weight: 700; color: var(--accent); margin-top: 8px; }
  #present .pprice s { color: var(--muted); font-size: .6em; font-weight: 500; margin-right: 10px; }
  #present .ptext { font-size: clamp(20px, 2.4vw, 27px); line-height: 1.5; margin-top: 28px; max-width: 30ch; }
  #present .note { font-size: clamp(16px, 1.8vw, 20px); padding: 16px 20px; margin-top: 24px; max-width: 40ch; }
  #present .note .icon { width: 22px; height: 22px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>

<script id="data" type="application/json">__DATA_JSON__</script>

<div class="app" id="app">
  <div class="topbar">
    <div class="brand"><svg class="icon"><use href="#i-cross"/></svg>DrugStore Assistant AI</div>
    <div class="topbar-right">
      <span class="mode-pill" id="modePill"><span class="dot"></span><span id="modeLabel">Gesimuleerd</span></span>
      <button class="icon-btn" id="settingsBtn" aria-label="Instellingen" title="Instellingen"><svg class="icon"><use href="#i-gear"/></svg></button>
    </div>
  </div>
  <div class="body">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main"><div class="view" id="view"></div></main>
  </div>
</div>
<div class="pop" id="pop" hidden></div>
<div id="present" role="dialog" aria-label="Klantweergave op volledig scherm"></div>

<script>
'use strict';
const DATA = JSON.parse(document.getElementById('data').textContent);
const PRODUCTS = DATA.products, PROMOTIONS = DATA.promotions, POLICIES = DATA.policies;
const TODAY = new Date();

/* ---------- vocabulary (demo NLU) ---------- */
const SYMPTOM_SYNONYMS = {
  'hoofdpijn': ['hoofdpijn', 'migraine', 'koppijn', 'hoofd doet pijn'],
  'keelpijn': ['keelpijn', 'zere keel', 'pijnlijke keel', 'keel doet pijn', 'schorre keel'],
  'hoest': ['hoest', 'hoesten', 'kuch', 'kuchen', 'prikkelhoest', 'droge hoest'],
  'verkoudheid': ['verkouden', 'verkoudheid', 'snotteren', 'loopneus', 'griepje', 'griep'],
  'verstopte neus': ['verstopte neus', 'dichte neus', 'neus zit dicht', 'neus dicht', 'snotneus'],

  if (r.qtype === 'promo') {

  const altTxt = r.alternatives.length ? ` Alternatief: ${r.alternatives.map(a => `${a.p.name} (${a.why})`).join('; ')}.` : '';
  const blockTxt = r.blocked.length ? ` Niet aanbevelen: ${r.blocked.map(b => `${b.p.name} (${b.reason})`).join('; ')}.` : '';
  const flagTxt = r.recFlags && r.recFlags.length ? ` Let op: ${r.recFlags.join('; ')}.` : '';
  const timing = esc_.level === 'doctor' ? ' Als tijdelijke verlichting in de tussentijd:' : '';

}

/* ---------- live composition via Claude (presenter's own key) ---------- */
const LIVE_SYSTEM = `You write answers for a Dutch drugstore employee assistant. You receive a JSON context produced by the store's own rules engine. Rules:
- Write in Dutch. Output JSON with exactly two fields: employee_answer and customer_answer.
- Only mention products in context.recommended and context.alternatives. Never mention or suggest products outside the context, and never recommend anything listed under context.blocked (you may say why it was excluded).
- If context.escalation.level is "urgent" or "doctor", the FIRST sentence of both answers must be the referral. If "pharmacist", say the pharmacist should look along before selling.
- employee_answer: 3-6 sentences, factual, for the employee. Include the product id in parentheses, the usage line, active promotion with end date, every disclaimer verbatim, the excluded products with reasons, and alternatives.
- customer_answer: 2-4 warm, plain sentences for the customer. No ids, no internal reasoning, no words like "bron" or "triage". Include price, promotion if any, and the disclaimer in plain words.
- If context.noMatch is true, say honestly that nothing suitable is in the assortment and point to the pharmacist. Do not invent products.`;
async function composeLive(r) {
  const p = r.recommended;
  const ctxOut = {
    question: r.question, question_type: r.qtype,
    triage: { intended_for: whoLabel(r.triage), pregnant_or_nursing: r.triage.pregnant, complaints: r.triage.complaints.length ? r.triage.complaints : [r.triage.complaint_raw], duration: r.triage.duration, prior_remedies: r.triage.prior_remedies, prior_failed: r.triage.prior_failed },
    recommended: p ? { id: p.id, name: p.name, price_eur: p.price_eur, promo_price_eur: priceLine(p).was ? +priceLine(p).now.toFixed(2) : null, usage: p.usage, disclaimer: p.disclaimer, min_age: p.min_age, notes: r.recFlags || [] } : null,
    alternatives: r.alternatives.map(a => ({ id: a.p.id, name: a.p.name, price_eur: a.p.price_eur, why: a.why })),
    blocked: r.blocked.map(b => ({ id: b.p.id, name: b.p.name, reason: b.reason })),
    promotions: r.promos.map(pr => ({ id: pr.id, title: pr.title, type: pr.type, discount_percent: pr.discount_percent, end_date: pr.end_date, products: pr.product_ids.map(id => PRODUCTS.find(x => x.id === id).name) })),
    policies: r.policies.map(pl => ({ id: pl.id, title: pl.title, text: pl.description, customer_text: pl.customer_text })),
    escalation: r.escalation, noMatch: !!r.noMatch,
  };
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'x-api-key': state.apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true', 'anthropic-beta': 'server-side-fallback-2026-07-01' },
    body: JSON.stringify({
      model: 'claude-opus-5', max_tokens: 2048, fallbacks: 'default', system: LIVE_SYSTEM,
      messages: [{ role: 'user', content: JSON.stringify(ctxOut) }],
      output_config: { effort: 'low', format: { type: 'json_schema', schema: { type: 'object', properties: { employee_answer: { type: 'string' }, customer_answer: { type: 'string' } }, required: ['employee_answer', 'customer_answer'], additionalProperties: false } } },
    }),
  });
  if (!res.ok) { let msg = `HTTP ${res.status}`; try { msg += ': ' + ((await res.json()).error || {}).message; } catch (e) { /* no body */ } throw new Error(msg); }
  const data = await res.json();
  if (data.stop_reason === 'refusal') throw new Error('Claude weigerde dit verzoek (refusal)');
  const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
  return JSON.parse(text);
}

/* ---------- flow ---------- */
function startQuestion(q) {
  state.question = q; state.ctx = analyze(q); state.liveNotice = '';
  state.gaps = computeGaps(state.ctx);
  // if the complaint is known but matches nothing, answer honestly right away instead of asking more
  if (state.ctx.qtype === 'symptom' && (state.ctx.triage.complaints.length || state.ctx.triage.complaint_raw) && searchProducts(state.ctx).length === 0) state.gaps = [];
  if (state.gaps.length) { state.phase = 'triage'; render(); } else finish();
}
function answerGap(field, value) {
  const tr = state.ctx.triage;
  if (field === 'intended_for') { tr.intended_for = value; if (value !== 'kind') tr.age_bucket = 'volwassen'; }
  if (field === 'age') tr.age_bucket = value;
  if (field === 'duration') tr.duration = value;
  if (field === 'prior_remedies') tr.prior_remedies = value;
  if (field === 'complaints') {
    const t = norm(value); const tags = matchSymptoms(t);
    tr.complaints = tags; tr.complaint_raw = tags.length ? '' : value.trim();
    const dur = detectDuration(t); if (dur && !tr.duration) tr.duration = dur;
    if (searchProducts(state.ctx).length === 0) { state.gaps = []; finish(); return; }
  }
  state.gaps = computeGaps(state.ctx);
  if (state.gaps.length) render(); else finish();
}
async function finish() {
  state.ctx.triage.complete = true;
  state.phase = 'thinking'; render();
  const r = resolve(state.ctx);
  let text;
  if (state.mode === 'live' && state.apiKey) {
    try { text = await composeLive(r); r.mode = 'live'; }
    catch (e) { state.liveNotice = 'Live modus mislukt (' + e.message + '). Hieronder het gesimuleerde antwoord.'; text = composeSim(r); r.mode = 'sim'; }
  } else {
    await new Promise(res => setTimeout(res, 900));
    text = composeSim(r); r.mode = 'sim';
  }
  Object.assign(r, text);
  state.result = r; state.history.unshift(r);
  state.phase = 'answered'; state.view = 'employee'; render();
}
function reset() { state.phase = 'input'; state.question = ''; state.ctx = null; state.gaps = []; state.liveNotice = ''; state.view = 'ask'; render(); setTimeout(() => { const ta = document.getElementById('q'); if (ta) ta.focus(); }, 0); }

  if (r.policies.length) out += `<div class="card"><div class="label" style="margin-bottom:6px">${icon('i-shield', 'icon sm')} Beleid</div>${r.policies.map(p => `<div class="alt"><div><div style="font-weight:500">${esc(p.title)} <span class="src" style="margin:0 0 0 6px">${p.id}</span></div><div class="why">${esc(p.description)}</div></div></div>`).join('')}</div>`;
  out += `<div class="card"><div class="label" style="margin-bottom:10px">Bronnen</div>${r.sources.length ? uniq(r.sources).map(s => `<span class="src">${s}</span>`).join('') : '<span class="muted small">Geen records gebruikt</span>'}</div>`;
  return out;
}
function customerBlock(r, big) {
  const tr = r.triage;
  if (r.qtype === 'symptom' && r.recommended) {
    const p = r.recommended, pl = priceLine(p);
    return `<div class="${big ? 'pname' : 'product'}">${big ? esc(p.name) : `<div><div class="name">${esc(p.name)}</div></div><div class="price">${pl.was ? `<s>${eur(pl.was)}</s>` : ''}${eur(pl.now)}</div>`}</div>
      ${big ? `<div class="pprice">${pl.was ? `<s>${eur(pl.was)}</s>` : ''}${eur(pl.now)}</div>` : ''}
      <p class="${big ? 'ptext' : 'answer'}" style="${big ? '' : 'margin-top:14px'}">${esc(r.customer_answer)}</p>
      ${pl.promo ? `<div class="note promo">${icon('i-tag')}<span>${esc(pl.promo.title)}, t/m ${fmtDate(pl.promo.end_date)}</span></div>` : ''}
      ${p.min_age > 0 || p.age_restriction ? `<div class="note caution">${icon('i-alert')}<span>Vanaf ${Math.max(p.min_age, p.age_restriction || 0)} jaar</span></div>` : ''}`;
  }
  const title = r.qtype === 'policy' ? (r.policies[0] ? r.policies[0].title : 'Beleid') : r.qtype === 'promo' ? 'Aanbiedingen' : r.qtype === 'lookup' && r.recommended ? r.recommended.name : cap(complaintLabel(tr));
  return `<div class="${big ? 'pname' : 'name'}" style="${big ? '' : 'font-family:var(--display); font-size:18px; font-weight:600'}">${esc(title)}</div><p class="${big ? 'ptext' : 'answer'}" style="${big ? '' : 'margin-top:12px'}">${esc(r.customer_answer)}</p>`;
}
function renderCustomer() {
  const r = state.result;
  const head = `<div class="view-head"><div><h1>Klant</h1><p class="muted">Wat de klant te zien krijgt: kort, zonder interne informatie.</p></div>${r ? `<button class="btn-primary" data-action="present">${icon('i-expand', 'icon sm')}Volledig scherm</button>` : ''}</div>`;
  if (!r) return head + `<div class="card"><h2>Nog geen antwoord</h2><p class="muted" style="margin-top:6px">Stel eerst een vraag.</p><div class="row" style="margin-top:16px"><button class="btn-primary" data-action="new">Nieuwe vraag</button></div></div>`;
  return head + `<div class="card lift customer-card">${customerBlock(r, false)}</div>`;
}
/* ---------- analytics: structured log rows, no personal data ---------- */
function audienceLabel(tr) {
  if (!tr.intended_for) return 'Onbekend';
  if (tr.intended_for === 'kind') return 'Kind ' + (tr.age_bucket ? tr.age_bucket + ' jaar' : '(leeftijd onbekend)');
  return { mezelf: 'Klant zelf', partner: 'Partner', ander: 'Andere volwassene' }[tr.intended_for];
}
function logRow(r) {
  return {
    at: r.at, question_type: r.qtype, category: r.category,
    complaints: r.triage.complaints.join('|'), audience: audienceLabel(r.triage), pregnant: r.triage.pregnant ? 1 : 0,
    duration: r.triage.duration || '', prior_remedies: r.triage.prior_remedies || '',
    outcome: r.outcome, escalation: r.escalation ? r.escalation.level : 'none',
    recommended_id: r.recommended ? r.recommended.id : '', blocked_ids: (r.blocked || []).map(b => b.p.id).join('|'),
    promo_id: r.promos && r.promos.length ? r.promos[0].id : '', assortment_gap: r.outcome === 'no_match' && r.qtype === 'symptom' ? complaintLabel(r.triage) : '',
  };
}
function count(list, keyFn) {
  const m = new Map();
  for (const x of list) { const k = keyFn(x); if (k == null || k === '') continue; for (const kk of (Array.isArray(k) ? k : [k])) m.set(kk, (m.get(kk) || 0) + 1); }
  return [...m.entries()].sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0])));
}
function bars(entries, total, opts = {}) {
  if (!entries.length) return '<p class="muted small">Nog geen gegevens</p>';
  const max = entries[0][1];
  return entries.map(([k, n]) => `<div class="bar-row" title="${n} van ${total} (${total ? Math.round(n / total * 100) : 0}%)"><span class="bar-label">${esc(cap(String(k)))}${opts.sub && opts.sub[k] ? `<span class="bar-sub">${esc(opts.sub[k])}</span>` : ''}</span><span class="bar-track"><span class="bar-fill" style="width:${Math.max(3, n / max * 100)}%"></span></span><span class="bar-n">${n}</span></div>`).join('');
}
function exportCsv() {
  const cols = ['at', 'question_type', 'category', 'complaints', 'audience', 'pregnant', 'duration', 'prior_remedies', 'outcome', 'escalation', 'recommended_id', 'blocked_ids', 'promo_id', 'assortment_gap'];
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const lines = [cols.join(',')].concat([...state.history].reverse().map(r => { const row = logRow(r); return cols.map(c => q(row[c])).join(','); }));
  const blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'drugstore-inzichten.csv'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function renderInsights() {
  const H = state.history, N = H.length, tab = state.insightTab;
  const sym = H.filter(r => r.qtype === 'symptom');
  if (tab === 'klachten') return bars(count(H, r => r.triage.complaints.length ? r.triage.complaints : (r.qtype === 'symptom' && r.triage.complaint_raw ? r.triage.complaint_raw : null)), N);
  if (tab === 'categorieen') return bars(count(H, r => r.category), N) + `<p class="muted small" style="margin-top:12px">Vaste categorieën: ${STANDARD_CATEGORIES.join(', ')}.</p>`;
  if (tab === 'doelgroep') {
    const byAud = count(sym, r => audienceLabel(r.triage));
    const sub = {};
    for (const [aud] of byAud) { const top = count(sym.filter(r => audienceLabel(r.triage) === aud), r => r.triage.complaints.length ? r.triage.complaints : (r.triage.complaint_raw || null))[0]; sub[aud] = top ? 'meest gevraagd: ' + top[0] : ''; }
    return bars(byAud, sym.length, { sub }) + `<p class="muted small" style="margin-top:12px">Zwangerschap of borstvoeding vermeld bij ${sym.filter(r => r.triage.pregnant).length} van ${sym.length} symptoomvragen. Leeftijd wordt alleen als groep bewaard.</p>`;
  }
  if (tab === 'uitkomsten') {
    const OUT = { recommended: 'Product aanbevolen', blocked: 'Geen veilig product', no_match: 'Niet in assortiment', answered: 'Beantwoord uit beleid, acties of assortiment', unknown: 'Geen informatie beschikbaar' };
    const ESC = { pharmacist: 'Apotheker', doctor: 'Huisarts', urgent: 'Huisarts, vandaag nog' };
    return bars(count(H, r => OUT[r.outcome] || r.outcome), N)
      + `<div class="label" style="margin:18px 0 8px">Doorverwijzingen</div>` + bars(count(H.filter(r => r.escalation && r.escalation.level !== 'none'), r => ESC[r.escalation.level]), N)
      + `<div class="label" style="margin:18px 0 8px">Assortimentshiaten: gevraagd, niet in assortiment</div>` + bars(count(H.filter(r => r.outcome === 'no_match' && r.qtype === 'symptom'), r => complaintLabel(r.triage)), N);
  }
  if (tab === 'producten') {
    const recs = sym.filter(r => r.recommended);
    return `<div class="label" style="margin-bottom:8px">Meest aanbevolen</div>` + bars(count(recs, r => r.recommended.name), N)
      + `<div class="label" style="margin:18px 0 8px">Meest geblokkeerd door veiligheidsregels</div>` + bars(count(H, r => (r.blocked || []).map(b => b.p.name)), N)
      + `<p class="muted small" style="margin-top:12px">Actie getoond bij ${recs.filter(r => r.promos.length).length} van ${recs.length} aanbevelingen.</p>`;
  }
  return '';
}
function renderHistory() {
  const H = state.history, N = H.length;
  const pct = n => N ? Math.round(n / N * 100) + '%' : '0%';
  const referred = H.filter(r => r.escalation && r.escalation.level !== 'none').length;
  const gaps = H.filter(r => r.outcome === 'no_match').length;
  const withPromo = H.filter(r => r.promos && r.promos.length).length;
  const tabs = [['klachten', 'Klachten'], ['categorieen', 'Categorieën'], ['doelgroep', 'Doelgroep'], ['uitkomsten', 'Uitkomsten'], ['producten', 'Producten']];
  const outcomeShort = r => r.qtype === 'symptom' ? (r.recommended ? shortName(r.recommended) : r.outcome === 'no_match' ? 'niet in assortiment' : 'geen veilig product') : { policy: 'beleid', promo: 'actie', lookup: r.recommended ? shortName(r.recommended) : 'niet gevonden', unknown: 'onbekend' }[r.qtype];
  return `<div class="view-head"><div><h1>Geschiedenis</h1><p class="muted">Vragen uit deze sessie en wat de winkel eruit kan leren. Geen persoonsgegevens: alleen categorieën, uitkomsten en leeftijdsgroepen.</p></div><button class="btn-outline" data-action="csv">${icon('i-download', 'icon sm')}Exporteer CSV</button></div>
    <div class="stats">
      <div class="stat"><div class="n">${N}</div><div class="l">Vragen</div></div>
      <div class="stat"><div class="n">${pct(referred)}</div><div class="l">Doorverwezen</div></div>
      <div class="stat"><div class="n">${pct(gaps)}</div><div class="l">Niet in assortiment</div></div>
      <div class="stat"><div class="n">${pct(withPromo)}</div><div class="l">Met actie</div></div>
    </div>
    <div class="card"><div class="label" style="margin-bottom:6px">Inzichten</div>
      <div class="tabs" role="tablist">${tabs.map(([id, l]) => `<button class="tab ${state.insightTab === id ? 'active' : ''}" role="tab" aria-selected="${state.insightTab === id}" data-tab="${id}">${l}</button>`).join('')}</div>
      ${renderInsights()}
    </div>
    <div class="card"><div class="label" style="margin-bottom:6px">Vragen, klik om opnieuw te openen</div>${N ? H.map((r, i) => `<button class="hist" data-hist="${i}"><div><div class="q">${esc(r.question)}</div><div class="m">${esc(r.timestamp)} · ${esc(r.category)}${r.escalation && r.escalation.level !== 'none' ? ' · doorverwezen' : ''}${r.mode === 'live' ? ' · Claude' : ''}</div></div><div class="c">${esc(outcomeShort(r))}</div></button>`).join('') : '<p class="muted">Nog geen vragen gesteld.</p>'}</div>`;
}
function renderSettings() {
  const pop = document.getElementById('pop');
  if (pop.hidden) return;
  pop.innerHTML = `<div class="card"><div class="row" style="justify-content:space-between"><h3>Instellingen</h3><button class="icon-btn" data-action="closeSettings" aria-label="Sluiten">${icon('i-x', 'icon sm')}</button></div>
    <label class="radio"><input type="radio" name="mode" value="sim" ${state.mode === 'sim' ? 'checked' : ''}><div><div style="font-weight:500">Gesimuleerd</div><div class="d">Werkt overal, ook offline. De antwoordtekst komt uit vaste sjablonen.</div></div></label>
    <label class="radio"><input type="radio" name="mode" value="live" ${state.mode === 'live' ? 'checked' : ''}><div><div style="font-weight:500">Live Claude</div><div class="d">Claude schrijft de twee antwoorden op basis van dezelfde lokale zoek- en veiligheidsuitkomst. Vereist een eigen Anthropic API-sleutel.</div></div></label>
    <div style="margin-top:8px"><label class="label" for="key">API-sleutel</label><input id="key" class="input" type="password" autocomplete="off" placeholder="sk-ant-..." value="${esc(state.apiKey)}" style="width:100%; margin-top:6px"></div>
    <p class="muted small" style="margin-top:10px">De sleutel blijft alleen in het geheugen van dit tabblad en wordt nergens opgeslagen of verstuurd behalve naar api.anthropic.com. Gebruik dit alleen op je eigen laptop; in het echte product blijft de sleutel op de server.</p>
  </div>`;
}
function render() {
  renderSidebar();
  const v = document.getElementById('view');
  v.innerHTML = state.view === 'ask' ? renderAsk() : state.view === 'employee' ? renderEmployee() : state.view === 'customer' ? renderCustomer() : renderHistory();
  renderSettings();
}
function openPresent() {
  const r = state.result; if (!r) return;
  const el = document.getElementById('present');
  el.innerHTML = `<button class="btn-ghost close" data-action="closePresent">${icon('i-x', 'icon sm')}Sluiten</button><div style="max-width:60ch">${customerBlock(r, true)}</div>`;
  el.classList.add('on');
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-view],[data-action],[data-example],[data-gap],[data-hist],[data-tab]');
  if (!b) { if (!e.target.closest('#pop') && !e.target.closest('#settingsBtn')) { const pop = document.getElementById('pop'); if (!pop.hidden) { pop.hidden = true; } } return; }
  if (b.dataset.view) { state.view = b.dataset.view; render(); return; }
  if (b.dataset.example) { state.view = 'ask'; state.phase = 'input'; state.question = b.dataset.example; render(); startQuestion(b.dataset.example); return; }
  if (b.dataset.hist !== undefined) { state.result = state.history[+b.dataset.hist]; state.view = 'employee'; render(); return; }
  if (b.dataset.tab) { state.insightTab = b.dataset.tab; render(); return; }
  if (b.dataset.gap && b.dataset.value !== undefined) { answerGap(b.dataset.gap, b.dataset.value); return; }
  const a = b.dataset.action;
  if (a === 'send') { const q = document.getElementById('q').value.trim(); if (q) startQuestion(q); }
  if (a === 'free') { const v = document.getElementById('free').value.trim(); if (v) answerGap(b.dataset.gap, v); }
  if (a === 'new') reset();
  if (a === 'present') openPresent();
  if (a === 'csv') exportCsv();
  if (a === 'closePresent') document.getElementById('present').classList.remove('on');
  if (a === 'closeSettings') document.getElementById('pop').hidden = true;
});
document.getElementById('settingsBtn').addEventListener('click', () => { const pop = document.getElementById('pop'); pop.hidden = !pop.hidden; renderSettings(); });
document.addEventListener('change', e => {
  if (e.target.name === 'mode') { state.mode = e.target.value; renderSidebar(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'key') state.apiKey = e.target.value.trim();
  if (e.target.id === 'q') state.question = e.target.value;
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { document.getElementById('present').classList.remove('on'); document.getElementById('pop').hidden = true; }
  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'q') { e.preventDefault(); const q = e.target.value.trim(); if (q) startQuestion(q); }
  if (e.key === 'Enter' && e.target.id === 'free') { e.preventDefault(); const v = e.target.value.trim(); if (v) answerGap(state.gaps[0], v); }
});

/* ---------- seed: ten realistic earlier questions so the tool opens in a working state ---------- */
function seed(question, fill, dayOffset, hhmm) {
  const ctx = analyze(question); Object.assign(ctx.triage, fill || {}); ctx.triage.complete = true;
  const r = resolve(ctx); Object.assign(r, composeSim(r)); r.mode = 'sim';
  const d = new Date(TODAY); d.setDate(d.getDate() - dayOffset); const [h, m] = hhmm.split(':'); d.setHours(+h, +m, 0, 0);
  r.at = d.toISOString();
  r.timestamp = (dayOffset === 0 ? 'Vandaag' : dayOffset === 1 ? 'Gisteren' : fmtDate(d.toISOString().slice(0, 10))) + ' ' + hhmm;
  state.history.unshift(r);
}
seed('Mijn moeder van 72 heeft al langere tijd last van gewrichtspijn, ze gebruikt medicijnen van de huisarts', {}, 1, '09:02');
seed('Hebben jullie vitamine D?', {}, 1, '10:15');
seed('Mijn zoon van 15 heeft puistjes, sinds een paar maanden, hij heeft nog niets geprobeerd', {}, 1, '11:40');
seed('Is er korting op aftersun?', {}, 1, '13:05');
seed('Mijn peuter heeft koorts sinds vannacht, nog niets gegeven', {}, 1, '15:30');
seed('Heb je iets tegen wratten?', {}, 1, '16:48');
seed('Kan ik een geopende dagcrème retourneren?', {}, 0, '08:41');
seed('Ik ben zwanger en heb sinds vanochtend hoofdpijn, nog niets genomen', {}, 0, '09:12');
seed('Mijn zoon van 8 heeft sinds gisteren keelpijn, we hebben nog niets geprobeerd', {}, 0, '09:35');
seed('Mijn partner wil stoppen met roken, hij heeft eerder pleisters geprobeerd', { duration: 'een week of langer' }, 0, '10:20');
state.result = state.history[0];
render();
</script>
